[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nbu-exporter"
version = "0.2.1"
description = "Prometheus exporter for Veritas NetBackup"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "prometheus_client>=0.19.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
]

[project.scripts]
nbu-exporter = "nbu_exporter.main:cli_main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.7",
    "ruff>=0.1.6",
    "requests-mock>=1.11",
    "types-requests",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["nbu_exporter*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RET"]
# N815/N802/N803/N806: config dataclass fields mirror YAML camelCase keys on
# purpose — operators copy values directly between docs and config.yaml.
ignore = ["E501", "N815", "N802", "N803", "N806"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
